<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0a">
  <title>Petra Foto</title>
  <style>
    html,body{margin:0;min-height:100%;background:#090a0a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    .box{text-align:center;color:#b8bcba}
  </style>
</head>
<body>
  <div class="box">Apertura di Petra Foto…</div>
  <script>
    (function(){
      const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9_-]/g,'');
      location.replace('./?workspace='+encodeURIComponent(id));
    })();
  </script>
</body>
</html>
