      <div class="hero-copy">
        <h1 class="editable-ui" id="heroTitle">Petra Foto</h1>
        <p class="editable-ui" id="heroSubtitle">Crea, modifica e stampa le tue Mini 54 × 86 mm.</p>
        <div class="badges editable-ui" id="heroBadges">
          <span>9 per A4</span><span>Foto locali</span><span>Qualsiasi stampante</span>
        </div>
      </div>
    </header>

    <section class="actions">
<button id="clearAllBtn" class="soft">Svuota tutto</button>
      <button id="printBtn" class="primary">Stampa / Salva PDF</button>
    </section>

    <section class="sheet-shell">
      <div class="sheet" id="sheet"></div>
    </section>
    <section class="gallery" id="gallerySection">
      <div class="gallery-head"><strong>Galleria locale</strong><span id="galleryCount">0 miniature</span></div>
      <div class="gallery-grid" id="gallery"></div>
    </section>

    <p class="print-note">Stampa: A4 • scala 100% / dimensioni effettive • margini minimi/nessuno • intestazioni e piè di pagina disattivati.</p>
  </main>

  <dialog id="editor">
    <form method="dialog" class="editor-card">
      <header class="editor-head">
        <div><strong>Modifica miniatura</strong><small id="qualityText"></small></div>
        <button value="cancel" class="icon">✕</button>
      </header>
      <div class="editor-preview">
        <div class="instax-large" id="instaxPreview">
          <div class="instax-window selected-editable" id="editorWindow" data-edit-target="photo"><img id="editorImg" alt=""><span class="edit-chip">FOTO</span></div>
          <input id="captionInput" class="caption-large" data-edit-target="text" placeholder="Tocca qui per scrivere data o testo" maxlength="42">
        </div>
      </div>
      <nav class="tabs">
        <button type="button" data-tab="position" class="active">Posizione</button>
        <button type="button" data-tab="filters">Filtri</button>
        <button type="button" data-tab="adjust">Regola</button>
        <button type="button" data-tab="text">Testo</button>
      </nav>
      <section class="panel active" data-panel="position">
        <label>Zoom <input id="zoom" type="range" min="1" max="3" step=".01"></label>
        <label>Rotazione <input id="rotation" type="range" min="-180" max="180" step="1"></label>
        <div class="row">
          <button type="button" id="rotLeft">↶ 90°</button>
          <button type="button" id="rotRight">↷ 90°</button>
          <button type="button" id="flipH">↔ Flip H</button>
          <button type="button" id="flipV">↕ Flip V</button>
          <button type="button" id="beforeAfter">Prima/Dopo</button>
          <button type="button" id="resetTransform">Reset</button>
        </div>
      </section>
      <section class="panel" data-panel="filters">
        <div id="filterPresets" class="preset-grid"></div>
        <div class="frame-row">
          <label>Cornice
            <select id="frameStyle">
              <option value="none">Nessuna</option>
              <option value="soft">Soft</option>
              <option value="classic">Classica</option>
              <option value="black">Nera</option>
            </select>
          </label>
        </div>
      </section>
      <section class="panel" data-panel="adjust">
        <label>Luminosità <input id="brightness" type="range" min="50" max="150" step="1"></label>
        <label>Contrasto <input id="contrast" type="range" min="50" max="160" step="1"></label>
        <label>Saturazione <input id="saturation" type="range" min="0" max="200" step="1"></label>
        <label>Calore <input id="warmth" type="range" min="-50" max="50" step="1"></label>
        <label>Vignettatura <input id="vignette" type="range" min="0" max="70" step="1"></label>
        <label>Nitidezza <input id="sharpness" type="range" min="0" max="100" step="1"></label>
      </section>
      <section class="panel" data-panel="text">
        <label>Dimensione <input id="captionSize" type="range" min="10" max="28" step="1"></label>
        <label>Colore <input id="captionColor" type="color"></label>
        <div class="row"><button type="button" data-align="left">Sinistra</button><button type="button" data-align="center">Centro</button><button type="button" data-align="right">Destra</button></div>
      </section>
      <footer class="editor-footer">
        <div class="row">
          <button type="button" id="undoBtn">Annulla</button>
          <button type="button" id="redoBtn">Ripeti</button>
          <button type="button" id="replaceBtn">Sostituisci</button>
        </div>
        <div class="row">
          <button type="button" id="duplicateBtn">Duplica</button>
          <button type="button" id="deleteBtn">Elimina</button>
          <button type="button" id="downloadJpgBtn">JPG</button>
          <button type="button" id="shareBtn">Condividi</button>
          <button type="button" id="saveSlotBtn" class="primary">Salva</button>
        </div>
      </footer>
      <input id="replaceFile" type="file" accept="image/*" hidden>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
